<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Empleados</title>
</head>
<body>

  <a th:href="@{/}">Inicio</a>

  <!-- Filtro -->
  <form method="get" action="/empleados">
    <input type="text" name="cargo" th:value="${cargoFiltro}"
           placeholder="Filtrar por cargo..."/>
    <button type="submit">Buscar</button>
    <a th:href="@{/empleados}">Ver todos</a>
  </form>

  <!-- Insertar -->
  <form method="post" action="/empleados/insertar">
    <input type="text"   name="nombre"   placeholder="Nombre"/>
    <input type="text"   name="apellido" placeholder="Apellido"/>
    <input type="text"   name="dni"      placeholder="DNI"/>
    <input type="text"   name="cargo"    placeholder="Cargo"/>
    <input type="number" name="salario"  placeholder="Salario" step="0.01"/>
    <button type="submit">Guardar</button>
  </form>
  
  <hr>
  <br>

  <!-- Tabla -->
  <table border="1">
    <thead>
      <tr>
        <th>ID</th><th>Nombre</th><th>Apellido</th>
        <th>DNI</th><th>Cargo</th><th>Salario</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="e : ${empleados}">
        <td th:text="${e.id}"></td>
        <td th:text="${e.nombre}"></td>
        <td th:text="${e.apellido}"></td>
        <td th:text="${e.dni}"></td>
        <td th:text="${e.cargo}"></td>
        <td th:text="${e.salario}"></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
