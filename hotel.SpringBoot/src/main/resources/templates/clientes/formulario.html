<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Nuevo cliente</title></head>
<body>

  <h2>Nuevo cliente</h2>

  <form th:action="@{/clientes/guardar}"
        th:object="${cliente}"
        method="post">

    <label>Nombre:     <input type="text" th:field="*{nombre}"/></label><br/>
    <label>Apellido:   <input type="text" th:field="*{apellido}"/></label><br/>
    <label>DNI:        <input type="text" th:field="*{dni}"/></label><br/>
    <label>Email:      <input type="email" th:field="*{email}"/></label><br/>
    <label>Habitación: <input type="text" th:field="*{habitacion}"/></label><br/>

    <button type="submit">Guardar</button>
    <a th:href="@{/clientes}">Cancelar</a>

  </form>

</body>
</html>
